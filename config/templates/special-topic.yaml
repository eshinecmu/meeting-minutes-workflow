meta:
  template_id: tpl-special-topic-v1
  name: 专题会议纪要
  meeting_kind: special_topic
  version: 2

required_elements:
  - key: title
    label: 标题
    pattern: "^.{4,30}$"
  - key: meeting_time
    label: 会议时间
  - key: location
    label: 会议地点
  - key: host
    label: 主持人
  - key: attendees
    label: 参会人员
    min_count: 2
  - key: topics
    label: 议题
    min_count: 1
  - key: resolutions
    label: 议定事项
    min_count: 1

section_order:
  - 会议基本情况
  - 专题研究事项
  - 议定事项
  - 工作要求

style:
  readings_allowed:
    - 会议认为
    - 会议指出
    - 会议强调
    - 会议要求
    - 会议决定
    - 会议明确
    - 会议研究
    - 会议听取
  readings_forbidden:
    - 大家觉得
    - 差不多
    - 可能吧
    - 应该是
    - 反正
    - 搞定
    - 弄一下
    - 有点问题
  section_bindings:
    会议基本情况: meeting_meta
    专题研究事项: discussions
    议定事项: resolutions
    工作要求: actions
